name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported Bun (matches engines.bun >=1.3.0) and the pinned
        # current version. A drift in either direction surfaces before main.
        bun: ["1.3.0", "1.3.5"]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - run: bun run check

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Coverage numbers are reported against the pinned current version.
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
