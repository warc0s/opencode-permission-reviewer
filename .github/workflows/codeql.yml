name: codeql

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Weekly scan on Monday.
    - cron: "16 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript-typescript
          # The plugin shells out to read-only enrichment commands and replies
          # through an authenticated transport. Tune the suite to surface
          # command-injection and path-traversal regressions.
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        id: analyze
        with:
          category: "/language:javascript-typescript"
          output: sarif-results
      # Suppression annotations (`// codeql[rule-id]`) tag suppressed results
      # in the SARIF, but GitHub does not dismiss existing alerts from that
      # alone: apply the dismissals after each default-branch analysis so
      # annotated false positives do not linger as open alerts.
      - name: Dismiss suppressed alerts
        if: github.ref == 'refs/heads/main'
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          # Directory mode: the action discovers every *.sarif in it, so the
          # step does not depend on the exact file naming of codeql-action.
          sarif-file: sarif-results
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Stable required-check name for branch protection (matches the workflow name
  # already configured on main). Must use always() so a failed analyze still
  # reports a red gate instead of a skipped/pending required check.
  codeql:
    name: codeql
    if: always()
    needs: [analyze]
    runs-on: ubuntu-latest
    steps:
      - name: CodeQL analysis green
        run: |
          [ "${{ needs.analyze.result }}" = "success" ] || { echo "analyze failed: ${{ needs.analyze.result }}"; exit 1; }
