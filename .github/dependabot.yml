version: 2
updates:
  # Bun dependencies are checked daily so OpenCode host updates surface quickly.
  # Other packages wait through a stability window before Dependabot proposes them.
  # PRs target `dev` (the integration branch) instead of `main` so Dependabot
  # compares against the up-to-date manifest and does not re-open PRs for
  # versions already integrated.
  - package-ecosystem: bun
    directory: /
    target-branch: dev
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      exclude:
        - "@opencode-ai/*"
        - "@opencode/*"
    groups:
      # Keep the two supported OpenCode host generations independently reviewable.
      opencode-v1:
        patterns:
          - "@opencode-ai/*"
        update-types:
          - minor
          - patch
      opencode-v2:
        patterns:
          - "@opencode/*"
        update-types:
          - minor
          - patch
      # Non-breaking updates outside OpenCode batch after the stability window.
      patch-and-minor:
        patterns:
          - "*"
        exclude-patterns:
          - "@opencode-ai/*"
          - "@opencode/*"
        update-types:
          - minor
          - patch
    ignore:
      # A new major represents a new host generation and needs an explicit migration.
      - dependency-name: "@opencode-ai/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@opencode/*"
        update-types:
          - version-update:semver-major
      # These exact pins form one peer-compatible set. Move them together
      # manually so package installs keep a single Solid runtime.
      - dependency-name: "@opentui/core"
      - dependency-name: "@opentui/solid"
      - dependency-name: solid-js
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions used in workflows.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope
