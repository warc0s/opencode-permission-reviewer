name: release

# Pushing a `v*` tag builds and publishes the package with provenance, then
# creates checksums, an SBOM, and a GitHub Release. Manual dispatch retries an
# existing tag without moving it.
#
# The workflow is split so the job that installs dependencies and builds
# never holds write permissions: `build` only reads (and uploads the artifact
# plus its checksum), `publish` downloads the artifact, re-verifies its
# SHA-256 against the checksums produced next to the build, and only then
# publishes and creates the release.
#
# Prerequisites (configure once in repo settings):
#   - Secret `NPM_TOKEN` with publish rights for `opencode-permission-reviewer`.
#   - Actions → General → "Workflow permissions" allows id-token writes
#     (required for npm --provenance).
#
# PENDING ADMINISTRATIVE STEP (not satisfiable by any change to this file):
#   protect the `v*` tags with a repository ruleset restricting tag
#   creation/update/deletion to maintainers (Rules → Rulesets → New branch
#   ruleset applied to `refs/tags/v*`, or:
#     gh api -X POST /repos/Warc0s/opencode-permission-reviewer/rulesets -f ...
#   with restrictions=push for refs/tags/v*). A tag-triggered workflow can
#   never be its own root of trust: whoever controls the tagged commit
#   controls these guards, so tag protection must live outside the repo.
#
# Prereleases use next; legacy maintenance uses v1 without moving latest.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history for tag ancestry checks and release notes.
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      # Guard against mistags BEFORE any toolchain or dependency code runs:
      # the tag must point at HEAD, HEAD must descend from origin/main, and
      # the tag version must equal package.json's. Pure git + shell (no bun,
      # no node) so an invalid tag fails without executing anything from the
      # dependency tree.
      - name: Verify tag (pre-install gate)
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)" ]
          git merge-base --is-ancestor HEAD origin/main
          pkg_version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)
          if [ "$RELEASE_TAG" != "v$pkg_version" ]; then
            echo "Tag $RELEASE_TAG is not v + package.json version $pkg_version"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - name: Read tag metadata
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: GITHUB_REF_NAME="$RELEASE_TAG" bun scripts/release-metadata.ts

      # Build must pass the same gate as CI before we cut an artifact.
      - name: Build
        run: bun run check

      # Pack into a tarball and verify the ship set.
      - name: Pack
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
          set -- artifacts/*.tgz
          [ "$#" -eq 1 ] && [ -f "$1" ]
          REVIEWER_TEST_TARBALL="$PWD/$1" bun run test:package
          echo "##[group]Tarball contents"
          tar -tzf artifacts/*.tgz | sort
          echo "##[endgroup]"

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum *.tgz > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifact
          path: artifacts/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CHANGELOG notes and `gh release --target main` need the repo, but
          # no credentials are persisted after this step.
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Re-verify tag still points at this commit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)" ]

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifact
          path: artifacts

      # Integrity handoff: the artifact must still match the checksum
      # generated next to the build, byte for byte.
      - name: Verify artifact checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum --check checksums-sha256.txt

      # Install Node/npm for publishing. setup-node configures the npm
      # registry auth from NODE_AUTH_TOKEN via .npmrc automatically.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Publish the exact verified artifact.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -- artifacts/*.tgz
          [ "$#" -eq 1 ]
          npm publish "./$1" \
            --provenance \
            --access public \
            --tag "${{ needs.build.outputs.dist_tag }}"

      # Generate a CycloneDX SBOM from the extracted tarball contents.
      - name: Extract tarball for SBOM
        run: |
          mkdir -p sbom-src
          tar -xzf artifacts/*.tgz -C sbom-src --strip-components=1
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-src
          format: cyclonedx-json
          output-file: artifacts/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Create the GitHub Release with notes extracted from CHANGELOG.md.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract the matching section from CHANGELOG.md (falls back to
          # auto-generated notes if the section is not found).
          version="${{ needs.build.outputs.version }}"
          notes=$(awk -v v="$version" '
            /^## \[/ { in_section=0 }
            $0 ~ "^## \\[" v "\\]" { in_section=1; next }
            in_section { print }
          ' CHANGELOG.md)

          tag="${{ needs.build.outputs.tag }}"
          if [ "${{ needs.build.outputs.prerelease }}" = "true" ]; then
            gh release create "$tag" --title "$tag" --target main --prerelease --latest=false
          elif [ "${{ needs.build.outputs.dist_tag }}" = "v1" ]; then
            gh release create "$tag" --title "$tag" --target main --latest=false
          else
            gh release create "$tag" --title "$tag" --target main
          fi

          if [ -n "$notes" ]; then
            printf '%s\n' "$notes" | gh release edit "$tag" --notes-file -
          else
            gh release edit "$tag" --generate-notes
          fi

          gh release upload "$tag" \
            artifacts/*.tgz \
            artifacts/checksums-sha256.txt \
            artifacts/sbom.cdx.json \
            --clobber
