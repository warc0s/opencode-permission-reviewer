name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly scan on Monday.
    - cron: "16 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # The plugin shells out to read-only enrichment commands and replies
          # through an authenticated transport. Tune the suite to surface
          # command-injection and path-traversal regressions.
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
