name: host compatibility advisory

on:
  workflow_dispatch:
  schedule:
    - cron: "19 8 * * *"

permissions:
  contents: read

jobs:
  newer-hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.5"
      - name: Report releases outside the verified matrix
        run: bun tests/compatibility/host-advisory.ts

  # Canary: run the functional suites against the current registry release.
  # It lives outside the ci workflow so a host regression never blocks merges;
  # a failure here means the next host bump needs work before it is pinned.
  latest-hosts:
    name: latest host (${{ matrix.host }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        host: [v1, v2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.5"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: python -m pip install pytest==9.1.1
      - name: Install the latest registry host in a scratch directory
        env:
          HOST_GENERATION: ${{ matrix.host }}
          HOST_RELEASE: latest
        run: bun tests/compatibility/install-hosts.ts
      - name: Exercise the latest host with isolated config and synthetic models
        env:
          HOST_GENERATION: ${{ matrix.host }}
        run: |
          if [ "$HOST_GENERATION" = v1 ]; then
            python -m pytest tests/compatibility/test_opencode_v1.py tests/compatibility/test_local_evidence.py -q
            python -m pytest tests/compatibility/test_tui.py -k v1 -q
          else
            python -m pytest tests/compatibility/test_opencode_v2.py tests/compatibility/test_v2_reviewer.py tests/compatibility/test_local_evidence.py -q
            python -m pytest tests/compatibility/test_tui.py -k v2 -q
          fi
